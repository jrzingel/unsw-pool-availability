[project]
name = "poolstatus"
version = "0.1.0"
description = "Lane availability for the UNSW Fitness & Aquatic Centre pool"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
]

[project.scripts]
poolstatus = "poolstatus.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["poolstatus"]
